spring:
  application:
    name: ${SPRING_APPLICATION_NAME:template-api}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/plain,application/xml

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

outbox:
  schemas: shared
  poll-interval-ms: 1000
  purge-cron: "0 0 3 * * ?"

partition:
  maintenance-cron: "0 0 2 1 * ?"
  lookahead-months: 3
  lookbehind-months: 1
