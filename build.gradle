plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.template'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.addAll([
		'-parameters',
		'-Xlint:all',
		'-Xlint:-processing',
		'-Xlint:-serial'
	])
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', '1.4.0')
	set('testcontainersVersion', '1.20.5')
	set('archunitVersion', '1.4.1')
	set('springdocVersion', '2.8.5')
	set('awaitilityVersion', '4.2.2')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
	}
}

dependencies {
	// ==========================================
	// 1. Spring Boot Core, Web & Validation
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// ==========================================
	// 2. Spring Modulith (Hexagonal Architecture)
	// ==========================================
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-events-api'
	implementation 'org.springframework.modulith:spring-modulith-api'

	// ==========================================
	// 3. Relational Persistence (PostgreSQL 17 + Flyway)
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// ==========================================
	// 4. Observability & Production Actuator
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-core'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// ==========================================
	// 5. Annotation Processors & Developer Tools
	// ==========================================
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// ==========================================
	// 5b. API Documentation (OpenAPI / Swagger)
	// ==========================================
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// ==========================================
	// 6. Testing, Modulith, Containers & ArchUnit
	// ==========================================
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"
	testImplementation "org.awaitility:awaitility:${awaitilityVersion}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

// ==========================================
// PROTOCOLO syncStandards: Descarga atómica inmutable
// ==========================================
tasks.register('syncStandards') {
	group = 'fprog'
	description = 'Sincroniza atómicamente los estándares desde el repositorio central de GitHub'
	doLast {
		def org = project.findProperty('standards.org') ?: 'erft'
		def preset = project.findProperty('standards.preset') ?: 'erft-fprog-preset-java-spring-modulith'
		def standardsVersion = project.findProperty('standards.version') ?: 'main'
		def baseUrl = "https://raw.githubusercontent.com/${org}/${preset}/${standardsVersion}"
		def targetDir = file('.standards')
		def adrsDir = new File(targetDir, 'adrs')

		if (!adrsDir.exists()) {
			adrsDir.mkdirs()
		}

		['ARCHITECTURE.md', 'EXCEPTIONS.md', 'TESTING.md', 'dag-manifest.yaml'].each { fileName ->
			def destFile = new File(targetDir, fileName)
			def url = "${baseUrl}/${fileName}"
			println "Descargando ${url} -> ${destFile.path}..."
			try {
				destFile.text = new URL(url).text
			} catch (Exception ex) {
				println "Aviso: No se pudo descargar ${fileName} desde ${url}: ${ex.message}"
			}
		}

		(1..7).each { idx ->
			def adrName = String.format('ADR_%03d.md', idx)
			def destFile = new File(adrsDir, adrName)
			def url = "${baseUrl}/adrs/${adrName}"
			println "Descargando ${url} -> ${destFile.path}..."
			try {
				destFile.text = new URL(url).text
			} catch (Exception ex) {
				println "Aviso: No se pudo descargar ${adrName} desde ${url}: ${ex.message}"
			}
		}
		println "Sincronización de estándares completada (@${standardsVersion})."
	}
}
